name: Apptainer image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build, smoke test and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6

      - name: Build image
        # sudo: building from a definition file needs root (or user
        # namespaces, which Ubuntu 24.04 runners restrict by default)
        run: sudo apptainer build incompact3d.sif apptainer/incompact3d.def

      - name: Smoke test (5 iterations on 2 MPI ranks)
        run: |
          mkdir -p smoke/data
          cp incompact3d/cases/smoke-test/BC-Plumes.prm smoke/
          cd smoke
          timeout 600 apptainer exec ../incompact3d.sif \
            mpirun -np 2 incompact3d -i BC-Plumes.prm

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            apptainer registry login -u "${{ github.actor }}" --password-stdin oras://ghcr.io

      - name: Publish to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          apptainer push incompact3d.sif "oras://ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          apptainer push incompact3d.sif "oras://ghcr.io/${{ github.repository }}:latest"
